<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Sijil Berhenti Sekolah</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f0f2f5; color: #1a1a1a; }
  header { background: #0b5394; color: #fff; padding: 16px 24px; display:flex; justify-content:space-between; align-items:center;}
  header h1 { margin: 0; font-size: 20px; }
  .container { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .card h2 { margin-top: 0; font-size: 16px; color: #0b5394; border-bottom: 2px solid #eee; padding-bottom: 8px; }
  label { display: block; font-size: 13px; font-weight: bold; margin: 10px 0 4px; }
  input[type=text], input[type=date], input[type=password], select, textarea {
    width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;
  }
  input:disabled { background: #eee; color: #555; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
  .btn { display: inline-block; padding: 9px 16px; border: none; border-radius: 5px; cursor: pointer;
         font-size: 14px; font-weight: bold; margin: 6px 6px 0 0; }
  .btn-primary { background: #0b5394; color: #fff; }
  .btn-green { background: #2e7d32; color: #fff; }
  .btn-gray { background: #666; color: #fff; }
  .btn-red { background: #c62828; color: #fff; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; font-size: 13px; text-align: left; }
  th { background: #f5f5f5; }
  .muted { color: #777; font-size: 13px; }
  .row-actions button { padding: 4px 10px; font-size: 12px; }
  @media(max-width:700px){ .grid{grid-template-columns:1fr;} }

  /* ---- Skrin Log Masuk ---- */
  #loginScreen { position:fixed; inset:0; background:#0b5394; display:flex; align-items:center; justify-content:center; z-index:999; }
  .login-box { background:#fff; padding:30px; border-radius:10px; width:320px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,.3); }
  .login-box h2 { color:#0b5394; margin-top:0; }
  #app { display:none; }

  /* Banner status API */
  .banner { padding:10px 16px; border-radius:6px; font-size:13px; margin-bottom:16px; }
  .banner-warn { background:#fff3cd; color:#856404; border:1px solid #ffe69c; }
  .banner-ok { background:#d4edda; color:#155724; border:1px solid #b7dfc0; }

  /* ---------- SIJIL (CETAK) ---------- */
  #sijilArea { display: none; }
  .sijil {
    width: 210mm; min-height: 297mm; margin: 0 auto; padding: 22mm 20mm; background: #fff;
    border: 3px double #0b5394; color: #000; font-size: 14px;
  }
  .sijil-header { text-align: center; margin-bottom: 18px; }
  .sijil-header img { max-height: 90px; margin-bottom: 8px; }
  .sijil-title { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
  .sijil-sub { font-size: 16px; font-weight: bold; }
  .sijil ol { padding-left: 0; list-style: none; margin: 20px 0; }
  .sijil ol li { display: flex; margin-bottom: 9px; }
  .sijil .no { width: 26px; }
  .sijil .lbl { width: 260px; }
  .sijil .val { flex: 1; }
  .sijil .val::before { content: ": "; }
  .achv { width: 100%; border-collapse: collapse; margin: 8px 0; }
  .achv th, .achv td { border: 1px solid #000; padding: 5px; font-size: 12px; text-align: center; }
  .sign { margin-top: 55px; }
  .sign .line { margin-top: 45px; }

  @media print {
    body { background: #fff; }
    header, .container, #loginScreen { display: none !important; }
    #sijilArea { display: block !important; }
    .sijil { border: 3px double #0b5394; page-break-after: always; }
  }
</style>
</head>
<body>

<!-- ===== SKRIN LOG MASUK ===== -->
<div id="loginScreen">
  <div class="login-box">
    <h2>🎓 Log Masuk</h2>
    <p class="muted">Sistem Sijil Berhenti Sekolah</p>
    <input type="password" id="passInput" placeholder="Kata laluan" onkeydown="if(event.key==='Enter')login()">
    <div id="loginErr" style="color:#c62828;font-size:13px;margin-top:6px;"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="login()">Masuk</button>
  </div>
</div>

<!-- ===== APLIKASI ===== -->
<div id="app">
<header>
  <h1>🎓 Sistem Sijil Berhenti Sekolah</h1>
  <button class="btn btn-gray" style="margin:0" onclick="logout()">🚪 Log Keluar</button>
</header>

<div class="container">

  <div id="apiBanner"></div>

  <!-- Tetapan Sekolah -->
  <div class="card">
    <h2>⚙️ Tetapan Sekolah &amp; Logo</h2>
    <div class="grid">
      <div>
        <label>Nama Sekolah</label>
        <input type="text" id="setNamaSekolah" placeholder="cth: SK JALAN DATUK PALEMBANG">
      </div>
      <div>
        <label>Nama Guru Besar (tetap)</label>
        <input type="text" id="setGuruBesar" value="NOR HAMIZAH BINTI DAUD" disabled>
      </div>
      <div>
        <label>Tahun Sijil</label>
        <input type="text" id="setTahun" placeholder="cth: 2026">
      </div>
      <div>
        <label>Logo Sekolah (satu)</label>
        <input type="file" id="setLogo" accept="image/*">
      </div>
    </div>
    <img id="logoPreview" style="max-height:70px;margin-top:10px;display:none">
    <div><button class="btn btn-gray" onclick="simpanTetapan()">💾 Simpan Tetapan</button></div>
    <p class="muted">Nota: Tetapan sekolah &amp; logo disimpan dalam browser setiap komputer.</p>
  </div>

  <!-- Borang Murid -->
  <div class="card">
    <h2 id="formTitle">📝 Tambah Maklumat Murid</h2>
    <input type="hidden" id="editId" value="">
    <div class="grid">
      <div><label>1. Nama Penuh Murid</label><input type="text" id="f_nama"></div>
      <div><label>2. No. K/P Murid</label><input type="text" id="f_kp"></div>
      <div><label>3. No. Sijil Lahir</label><input type="text" id="f_sijillahir"></div>
      <div><label>4. Tempat Lahir</label><input type="text" id="f_tempatlahir"></div>
      <div><label>5. Tarikh Lahir</label><input type="date" id="f_tarikhlahir"></div>
      <div><label>6. Tarikh Masuk Sekolah</label><input type="date" id="f_tarikhmasuk"></div>
      <div><label>7. ID Murid</label><input type="text" id="f_idmurid"></div>
      <div><label>8. Darjah Masuk Sekolah</label><input type="text" id="f_darjahmasuk" placeholder="cth: TAHUN 1"></div>
      <div><label>9. Tarikh Tamat Sekolah</label><input type="date" id="f_tarikhtamat"></div>
      <div><label>10. Darjah Tertinggi Yang Akhir</label><input type="text" id="f_darjahakhir" placeholder="cth: TAHUN 6"></div>
      <div><label>11. Nama Sekolah Dahulu</label><input type="text" id="f_sekolahdahulu"></div>
      <div><label>13. Kelakuan</label><input type="text" id="f_kelakuan" placeholder="cth: BAIK"></div>
      <div><label>14. Sebab Berhenti</label><input type="text" id="f_sebab" placeholder="cth: TAMAT SEKOLAH RENDAH"></div>
    </div>

    <label>12. Pencapaian Istimewa / Kecenderungan Tertentu</label>
    <div class="grid">
      <div><label>Badan Beruniform</label><input type="text" id="f_uniform"></div>
      <div><label>Kelab dan Persatuan</label><input type="text" id="f_kelab"></div>
      <div><label>Sukan dan Permainan</label><input type="text" id="f_sukan"></div>
      <div><label>Lain-lain</label><input type="text" id="f_lain"></div>
    </div>

    <button class="btn btn-primary" onclick="simpanMurid()">💾 Simpan Murid</button>
    <button class="btn btn-gray" onclick="resetForm()">🧹 Kosongkan Borang</button>
  </div>

  <!-- Senarai Murid -->
  <div class="card">
    <h2>👥 Senarai Murid (dikongsi semua guru)
      <button class="btn btn-gray" style="float:right;margin:0" onclick="muatData()">🔄 Muat Semula</button>
    </h2>
    <div id="senaraiStatus" class="muted">Memuatkan data...</div>
    <table id="tblMurid" style="display:none">
      <thead><tr><th>#</th><th>Nama Murid</th><th>No. K/P</th><th>Tindakan</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

</div>
</div>

<!-- Kawasan sijil untuk cetak -->
<div id="sijilArea"></div>

<script>
/* ============================================================
   TETAPAN PENTING
   ------------------------------------------------------------
   1. KATA_LALUAN : kata laluan untuk guru log masuk
   2. API_URL     : URL Web App daripada Google Apps Script
      (lihat PANDUAN-SETUP.md untuk cara dapatkan URL ini)
   ============================================================ */
const KATA_LALUAN = 'Guru@2026';
const API_URL = 'https://script.google.com/macros/s/AKfycbxZ_GgrB8_hsErzqlMTaMinpU4iq2Bh89243qCzB6t4XZvt2oUbwD-lYIkW8siI7dOZ/exec';
/* ============================================================ */

const LS_SET = 'sijil_tetapan';
const FIELDS = ['nama','kp','sijillahir','tempatlahir','tarikhlahir','tarikhmasuk',
  'idmurid','darjahmasuk','tarikhtamat','darjahakhir','sekolahdahulu','kelakuan','sebab',
  'uniform','kelab','sukan','lain'];
let SENARAI = [];

// ---- Log Masuk ----
function login(){
  const p = passInput.value;
  if(p === KATA_LALUAN){
    sessionStorage.setItem('sijil_auth','1');
    loginScreen.style.display='none';
    app.style.display='block';
    mula();
  } else {
    loginErr.textContent = 'Kata laluan salah. Cuba lagi.';
  }
}
function logout(){ sessionStorage.removeItem('sijil_auth'); location.reload(); }
if(sessionStorage.getItem('sijil_auth')==='1'){
  loginScreen.style.display='none'; app.style.display='block';
}

// ---- Tetapan (localStorage) ----
function getTetapan(){ return JSON.parse(localStorage.getItem(LS_SET) || '{}'); }
function setTetapan(o){ localStorage.setItem(LS_SET, JSON.stringify(o)); }
function loadTetapan(){
  const t = getTetapan();
  setNamaSekolah.value = t.namaSekolah || 'SK JALAN DATUK PALEMBANG';
  setTahun.value = t.tahun || '2026';
  if(t.logo){ logoPreview.src = t.logo; logoPreview.style.display='block'; }
}
setLogo.addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{ logoPreview.src=ev.target.result; logoPreview.style.display='block'; logoPreview.dataset.data=ev.target.result; };
  r.readAsDataURL(f);
});
function simpanTetapan(){
  const t=getTetapan();
  setTetapan({ namaSekolah:setNamaSekolah.value.trim(), tahun:setTahun.value.trim(), logo:logoPreview.dataset.data||t.logo||'' });
  alert('Tetapan disimpan!');
}

// ---- Semak API ----
function apiSedia(){ return API_URL && API_URL.indexOf('http')===0; }
function paparBanner(){
  if(apiSedia()){
    apiBanner.innerHTML='<div class="banner banner-ok">✅ Bersambung ke pangkalan data (Google Sheet). Data dikongsi semua guru.</div>';
  } else {
    apiBanner.innerHTML='<div class="banner banner-warn">⚠️ API belum disambung. Sila masukkan URL Web App dalam kod (API_URL).</div>';
  }
}

// ---- Borang ----
function bacaBorang(){
  const m={}; FIELDS.forEach(f=>{ m[f]=document.getElementById('f_'+f).value; }); return m;
}
function isiBorang(m){
  FIELDS.forEach(f=>{ document.getElementById('f_'+f).value = (m&&m[f])||''; });
}
function resetForm(){ isiBorang({}); editId.value=''; formTitle.textContent='📝 Tambah Maklumat Murid'; }

async function simpanMurid(){
  const m=bacaBorang();
  if(!m.nama.trim()){ alert('Sila isi Nama Penuh Murid.'); return; }
  if(!apiSedia()){ alert('API belum disambung.'); return; }
  const isEdit = editId.value !== '';
  if(isEdit) m.id = editId.value;
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({ action: isEdit?'update':'add', murid: m })
    });
    const j = await res.json();
    if(j.ok){ resetForm(); await muatData(); alert('Data murid disimpan!'); }
    else alert('Ralat: '+(j.error||'tidak diketahui'));
  }catch(err){ alert('Ralat sambungan: '+err); }
}

function editMurid(id){
  const m = SENARAI.find(x=>String(x.id)===String(id));
  if(!m) return;
  isiBorang(m); editId.value=id;
  formTitle.textContent='✏️ Kemas Kini Maklumat Murid';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function padamMurid(id){
  if(!confirm('Padam murid ini?')) return;
  try{
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'delete', id:id }) });
    const j = await res.json();
    if(j.ok) await muatData(); else alert('Ralat: '+(j.error||''));
  }catch(err){ alert('Ralat sambungan: '+err); }
}

async function muatData(){
  if(!apiSedia()){ senaraiStatus.textContent='API belum disambung.'; senaraiStatus.style.display='block'; tblMurid.style.display='none'; return; }
  senaraiStatus.textContent='Memuatkan data...'; senaraiStatus.style.display='block';
  try{
    const res = await fetch(API_URL);
    const j = await res.json();
    SENARAI = j.data || [];
    render();
  }catch(err){ senaraiStatus.textContent='Ralat memuatkan data: '+err; }
}

function render(){
  const tb=tblMurid.querySelector('tbody'); tb.innerHTML='';
  if(SENARAI.length===0){ senaraiStatus.textContent='Belum ada data murid.'; senaraiStatus.style.display='block'; tblMurid.style.display='none'; return; }
  senaraiStatus.style.display='none'; tblMurid.style.display='table';
  SENARAI.forEach((m,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${i+1}</td><td>${m.nama||''}</td><td>${m.kp||''}</td>
      <td class="row-actions">
        <button class="btn btn-gray" onclick="editMurid('${m.id}')">Edit</button>
        <button class="btn btn-green" onclick="cetak('${m.id}')">Cetak</button>
        <button class="btn btn-red" onclick="padamMurid('${m.id}')">Padam</button>
      </td>`;
    tb.appendChild(tr);
  });
}

// ---- Cetak ----
function fmt(d){ if(!d) return ''; const s=String(d); const p=s.split('-'); return p.length===3? `${p[2]}/${p[1]}/${p[0]}` : s; }
function li(n,l,v){ return `<li><span class="no">${n}.</span><span class="lbl">${l}</span><span class="val">${v||''}</span></li>`; }
function cetak(id){
  const m=SENARAI.find(x=>String(x.id)===String(id)); if(!m) return;
  const t=getTetapan();
  const logo=t.logo?`<img src="${t.logo}">`:'';
  sijilArea.innerHTML=`
  <div class="sijil">
    <div class="sijil-header">${logo}
      <div class="sijil-title">SIJIL BERHENTI SEKOLAH</div>
      <div class="sijil-sub">TAHUN ${t.tahun||''}</div>
    </div>
    <ol>
      ${li(1,'NAMA PENUH MURID',m.nama)}
      ${li(2,'NO. K/P MURID',m.kp)}
      ${li(3,'NO. SIJIL LAHIR',m.sijillahir)}
      ${li(4,'TEMPAT LAHIR',m.tempatlahir)}
      ${li(5,'TARIKH LAHIR',fmt(m.tarikhlahir))}
      ${li(6,'TARIKH MASUK SEKOLAH',fmt(m.tarikhmasuk))}
      ${li(7,'ID MURID',m.idmurid)}
      ${li(8,'DARJAH MASUK SEKOLAH',m.darjahmasuk)}
      ${li(9,'TARIKH TAMAT SEKOLAH',fmt(m.tarikhtamat))}
      ${li(10,'DARJAH TERTINGGI YANG AKHIR',m.darjahakhir)}
      ${li(11,'NAMA SEKOLAH DAHULU',m.sekolahdahulu)}
      <li><span class="no">12.</span><span class="lbl">PENCAPAIAN ISTIMEWA ATAU KECENDERUNGAN TERTENTU</span></li>
    </ol>
    <table class="achv">
      <tr><th>BADAN BERUNIFORM</th><th>KELAB DAN PERSATUAN</th><th>SUKAN DAN PERMAINAN</th><th>LAIN-LAIN</th></tr>
      <tr><td>${m.uniform||'&nbsp;'}</td><td>${m.kelab||'&nbsp;'}</td><td>${m.sukan||'&nbsp;'}</td><td>${m.lain||'&nbsp;'}</td></tr>
    </table>
    <ol>
      ${li(13,'KELAKUAN',m.kelakuan)}
      ${li(14,'SEBAB BERHENTI',m.sebab)}
    </ol>
    <div class="sign">
      <div>........................................................</div>
      <div>(NOR HAMIZAH BINTI DAUD)</div>
      <div>GURU BESAR</div>
      <div>${t.namaSekolah||''}</div>
      <div class="line">TARIKH : ........................................</div>
    </div>
  </div>`;
  window.print();
}

// ---- Mula ----
function mula(){ loadTetapan(); paparBanner(); muatData(); }
if(sessionStorage.getItem('sijil_auth')==='1'){ mula(); }
</script>
</body>
</html>
